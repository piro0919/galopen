[package]
name = "galopen"
version = "0.6.3"
description = "Auto-open meeting URLs from macOS Calendar"
authors = ["piro"]
edition = "2021"

[lib]
name = "galopen_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2.5.1"
tauri-plugin-store = "2.5.0"
tauri-plugin-opener = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
open = "5.4.4"
tokio = { version = "1.53.2", features = ["full"] }
chrono = { version = "0.4.45", features = ["serde"] }
regex = "1.13.1"
url = "2.5.8"
log = "0.4.34"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSDate", "NSArray", "NSPredicate", "NSString", "NSError", "NSURL", "NSAttributedString", "NSRange", "NSValue"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSAttributedString",
    "NSButton",
    "NSControl",
    "NSFont",
    "NSFontDescriptor",
    "NSParagraphStyle",
    "NSResponder",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSText",
    "NSView",
] }
objc2-event-kit = { version = "0.3.2", features = [
    "EKTypes",
    "EKObject",
    "EKCalendar",
    "EKCalendarItem",
    "EKEvent",
    "EKEventStore",
    "EKParticipant",
] }
block2 = "0.6.2"
sys-locale = "0.3.2"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-updater = "2.13.1"
tauri-plugin-dialog = "2.8.1"

[profile.release]
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
